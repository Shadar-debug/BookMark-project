<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookmarks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <h1>📚 My Bookmarks</h1>
      <button id="openAddBtn" class="btn btn-primary">+ Add Bookmark</button>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input type="search" id="searchInput" placeholder="Search bookmarks..." autocomplete="off">
    </div>

    <section id="grid" class="grid"></section>

    <p id="emptyState" class="empty-state" hidden>
      No bookmarks yet. Click <strong>+ Add Bookmark</strong> to save your first one.
    </p>
  </main>

  <!-- Add / Edit modal -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Add Bookmark</h2>
        <button id="closeModalBtn" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <form id="bookmarkForm">
        <input type="hidden" id="bookmarkId">

        <label for="siteName">Name</label>
        <input type="text" id="siteName" placeholder="e.g. Google" required>

        <label for="siteUrl">URL</label>
        <input type="text" id="siteUrl" placeholder="e.g. https://google.com" required>

        <p id="formError" class="form-error" hidden></p>

        <div class="modal-actions">
          <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
          <button type="submit" id="saveBtn" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
